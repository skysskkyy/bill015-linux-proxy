# Reference only. The running proxy reads config.local.json by default.
server:
  host: 127.0.0.1
  port: 8787
  cors_allow_origins: []
  cors_allow_origin_regex: ^https?://(localhost|127\.0\.0\.1)(:\d+)?$

upstream:
  base_url: https://packyapi.com
  api_key_env: PACKY_API_KEY
  api_keys: []
  timeout_seconds: 600

mode: exploit

model:
  default: gpt-5.5
  aliases:
    codex-gpt55: gpt-5.5
    codex-gpt54: gpt-5.4
  force_default: false

bill015:
  bridge_strategy: emit_value
  function_name: emit_value
  final_answer_tool_name: submit_final_answer
  native_tool_choice: required
  native_parallel_tool_calls: false
  answer_field: answer
  max_output_tokens: 8192
  compaction_max_output_tokens: 8192
  max_answer_chars: 65536
  max_tool_argument_chars: 262144
  max_total_emit_value_chars: 393216
  force_emit_value: true
  block_passthrough: true
  block_normal_mode: true

logging:
  dir: S:\hack\packyapi.com\bill015_local_proxy\proxy_evidence
  store_prompts: false
  store_answers: false
  rotate_mb: 10

usage:
  estimator: auto
  prefer_tiktoken: true
  include_tools_schema: true
  include_images: true
  cache_ratio_default: 0.85
  max_text_for_exact_tokenize: 120000
  audit_breakdown: true

reasoning:
  # Kept high by default for Codex/GPT-5.6 quality parity. Explicit client
  # reasoning/model_reasoning_effort still wins per request.
  effort: high
  summary: auto

responses_events:
  fidelity_level: native
  emit_reasoning_summary: false
  emit_annotations: true
  allow_web_search_call_event: false
  emit_incomplete_on_truncation: true
  strict_sequence_numbers: true
  typed_keepalive: false
  chunk_size: 256

tool_bridge:
  # Fail closed: drop model-requested tools that are not present in the current
  # Codex tool catalog. Missing tools should be discovered through tool_search.
  allow_unknown_tools: false
  # Native-like default: do not synthesize extra tool_search calls beyond what
  # the model explicitly requested.
  auto_expand_search: false
  # If the latest user request clearly needs live web/URL lookup and only
  # tool_search is visible, return a local tool_search_call before contacting
  # upstream so Codex can expose browser/Chrome/Playwright/node_repl tools.
  local_web_research_preflight: true
  # Bounded but larger than the old 96-tool cap so GPT-5.6 CLI/Desktop
  # sessions with many MCP/plugin/subagent tools keep core tools callable.
  schema_max_tools: 256
  selection_max_tools: 160
  catalog_max_chars: 120000

multimodal:
  # native_passthrough: keep input_image parts on the wire.
  # local_extract: strip bytes and leave a loss notice.
  # reject: fail the request with 422.
  strategy: native_passthrough
  max_images: 8
  max_image_bytes: 10485760

limits:
  max_concurrency: 12
  max_queue_size: 8
  queue_wait_timeout_ms: 60000
  request_total_timeout_ms: 1200000
  max_request_bytes: 1048576
  upstream_retries: 2
  upstream_retry_backoff_ms: 700
  context_window_tokens: 128000
  auto_compact_percent: 90
  compact_target_percent: 75
  context_recovery_retries: 2
  empty_stream_retries: 1
  stream_recovery_retries: 1
  latest_tool_output_max_chars: 12000
  args_done_timeout_ms: 600000
  upstream_idle_timeout_ms: 300000
  circuit_failures: 0
  client_heartbeat_interval_ms: 5000

key_pool:
  # On an exact cyber_policy error, immediately retry the request with the next
  # available key and quarantine the failed key for this many seconds.
  cyber_policy_rotate: true
  failed_key_cooldown_seconds: 600

admin:
  token: change-me-local-admin
